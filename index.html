<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Billionaire Mindset Training</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0d10">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon.svg">
<style>
body{margin:0;background:#0d0d10;color:#eee;font:16px/1.5 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 80px}
main{max-width:560px;margin:auto;padding:16px}h1,h2{color:#d4af37;font-family:Georgia,serif;font-weight:400}
.card{background:#17171c;border:1px solid #2a2a30;border-radius:16px;padding:16px;margin:12px 0}
button{background:#d4af37;color:#111;border:0;border-radius:12px;padding:12px 16px;font-size:16px;margin:4px 4px 4px 0}
button.ghost{background:none;color:#d4af37;border:1px solid #d4af37}
textarea,input{width:100%;box-sizing:border-box;background:#0f0f13;color:#eee;border:1px solid #333;border-radius:10px;padding:10px;font-size:16px;margin:4px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111;border-top:1px solid #2a2a30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:#aaa;border-radius:0;margin:0}nav button.on{color:#d4af37}
.timer{font-size:48px;text-align:center;color:#d4af37}.muted{color:#888;font-size:13px}label{display:block;margin:6px 0}
</style></head><body><main id="app"></main>
<nav><button data-v="home">Today</button><button data-v="morning">Morning</button><button data-v="evening">Evening</button><button data-v="lessons">Lessons</button><button data-v="progress">Progress</button></nav>
<script src="app.js"></script></body></html>
